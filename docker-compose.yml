version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daurohqobuldm-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor # Jangan timpa vendor dari image
      - /var/www/html/bootstrap/cache # Jangan timpa cache dari image
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
      - ./storage:/var/www/html/storage
    networks:
      - daurohqobuldm-network

  web:
    image: nginx:alpine
    container_name: daurohqobuldm-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor # Tambahkan juga di sisi web agar rute terbaca
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./storage:/var/www/html/storage
    networks:
      - daurohqobuldm-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: daurohqobuldm-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: daurohqobuldm
      MYSQL_USER: admin
      MYSQL_PASSWORD: password_db_anda
      MYSQL_ROOT_PASSWORD: password_db_anda
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - daurohqobuldm-network

networks:
  daurohqobuldm-network:
    name: daurohqobuldm-network
    driver: bridge

volumes:
  db_data:
