server {
    listen 80;
    server_name daurohqobul.com www.daurohqobul.com localhost;
    root /var/www/html/public;

    index index.php index.html index.htm;

    charset utf-8;

    # Batas ukuran kiriman (bawaan nginx cuma 1 MB -> error 413 saat upload berkas PSB).
    # Berkas PSB maks 20 MB (4 berkas x 5 MB) + isian formulir, jadi diberi ruang 30 MB.
    # PHP sendiri dibatasi 64 MB di uploads.ini.
    client_max_body_size 30M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
