[global]
daemonize = no

[www]
listen = 9000

; Jumlah proses PHP yang melayani bersamaan (cocok untuk RAM 4 GB)
# nanti kalau ramnya kembali ke 2 GB, ubah pm.max_children = 8
# ganti ketika ramai dari 8 ke 20, karena kalau cuma 8, nanti sering muncul error 502 Bad Gateway
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500


